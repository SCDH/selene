               <h2>Trawr-Gesang von der noth Christi am Oelberg in dem Garten</h2>
               <p>Bey stiller nacht <span style="margin-left:2em"></span> zur ersten wacht</p>
               <p>Ein <span>stimm</span> sich gund zu klagen.</p>
               <p>Jch nam in acht <span style="margin-left:2em"></span> waß <span>die</span> doch sagt;</p>
               <p>That hin mit <span>Augen</span> schlagen. </p>
            </div>
      
  </div></body></html>
